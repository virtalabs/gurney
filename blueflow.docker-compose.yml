# Local dev: postgres + web (standalone bf-opencore).

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: blueflow
      POSTGRES_USER: blueflow
      POSTGRES_PASSWORD: blueflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: /app/.venv/bin/python project/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app # Mount app for dev workflow
      - web_venv:/app/.venv # Isolate container .venv from host .venv
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: project.settings.development
      DATABASE_URL: postgresql://blueflow:blueflow@db:5432/blueflow
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,*"
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-admin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-admin}
      CELERY_BROKER_URL: redis://redis:6379/0
volumes:
  postgres_data:
  web_venv:

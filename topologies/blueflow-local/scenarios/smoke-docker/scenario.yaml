# yaml-language-server: $schema=../../../../schemas/scenario.schema.json
# OBJ-2 Smoke Docker Verification
# This scenario is used to verify that the BlueFlow Docker image can be built and run.
---
name: smoke-docker
topology: topologies/blueflow-local/topology.yaml

nodes:
  - id: postgres
    build: up
    networks: [clinical-vlan]
  - id: redis
    build: up
    networks: [clinical-vlan]
  - id: blueflow
    build: up
    networks: [clinical-vlan]
  - id: celery-worker
    build: up
    networks: [clinical-vlan]
  - id: tapirx
    build: up
    networks: [clinical-vlan]
  - id: pacs-server
    build: up
    networks: [clinical-vlan]

"services":
  "postgres":
    "image": "postgres:16.6-alpine"
    "labels":
      "testbed.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.2"
    "environment":
    - "POSTGRES_DB=blueflow"
    - "POSTGRES_USER=blueflow"
    - "POSTGRES_PASSWORD=testbed"
    "healthcheck":
      "test":
      - "CMD-SHELL"
      - "pg_isready -U blueflow"
      "interval": "5s"
      "timeout": "3s"
      "retries": !!int "5"
  "redis":
    "image": "redis:7.4-alpine"
    "labels":
      "testbed.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.3"
    "healthcheck":
      "test":
      - "CMD"
      - "redis-cli"
      - "ping"
      "interval": "5s"
      "timeout": "3s"
      "retries": !!int "5"
  "blueflow":
    "image": "virtalabsinc/blueflow:testbed-3.0.0"
    "labels":
      "testbed.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.4"
    "ports":
    - "8000:8000"
    "environment":
    - "DATABASE_URL=postgresql://blueflow:testbed@192.168.10.2:5432/blueflow"
    - "REDIS_URL=redis://192.168.10.3:6379/0"
    - "DJANGO_SETTINGS_MODULE=project.settings.development"
    - "SECRET_KEY=testbed-only-not-for-production"
    - "DJANGO_ALLOWED_HOSTS=blueflow,localhost,127.0.0.1"
    - "DEFAULT_USERNAME=admin"
    - "DEFAULT_PASSWORD=admin"
    - "DJANGO_DEBUG=True"
    - "CELERY_TASK_ALWAYS_EAGER=true"
    "healthcheck":
      "test":
      - "CMD"
      - "python"
      - "-c"
      - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/').getcode()\
        \ < 400 else 1)"
      "interval": "5s"
      "timeout": "3s"
      "retries": !!int "10"
    "depends_on":
      "postgres":
        "condition": "service_healthy"
      "redis":
        "condition": "service_healthy"
  "tapirx":
    "image": "tapirx:local"
    "labels":
      "testbed.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.6"
    "environment":
    - "BLUEFLOW_API_URL=http://192.168.10.4:8000/api"
    - "LISTEN_INTERFACE=eth0"
    "depends_on":
      "blueflow":
        "condition": "service_healthy"
  "replay":
    "image": "replay:local"
    "labels":
      "testbed.managed": "true"
    "network_mode": "service:tapirx"
    "volumes":
    - "${PWD}/var/artifacts/pcap:/pcap:ro"
    "depends_on":
      "tapirx":
        "condition": "service_started"
  "check-0":
    "image": "curlimages/curl"
    "labels":
      "testbed.managed": "true"
    "command":
    - "curl"
    - "-s"
    - "-w"
    - "\n%{http_code}"
    - "--retry"
    - "3"
    - "--retry-delay"
    - "2"
    - "http://blueflow:8000/api/assets/"
    "depends_on":
      "blueflow":
        "condition": "service_healthy"
    "networks":
      "clinical-vlan": {}
"networks":
  "clinical-vlan":
    "driver": "bridge"
    "ipam":
      "driver": "default"
      "config":
      - "subnet": "192.168.10.0/24"
    "labels":
      "testbed.managed": "true"

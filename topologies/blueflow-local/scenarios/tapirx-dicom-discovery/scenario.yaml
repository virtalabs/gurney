# yaml-language-server: $schema=../../../../schemas/scenario.schema.json
# OBJ-2 TapirX DICOM Discovery Verification 
# This scenario is used to verify that TapirX can discover DICOM assets from a pcap file.
---
name: tapirx-dicom-pcap-replay
topology: topologies/blueflow-local/topology.yaml

facts:
  - name: assets_url
    value: http://blueflow:8000/api/assets/
  - name: capture_proxy_url
    value: http://replay:8765
  - name: blueflow_api_env
    value:
      DJANGO_ALLOWED_HOSTS: blueflow,localhost,127.0.0.1
      DEFAULT_USERNAME: admin
      DEFAULT_PASSWORD: admin
      DJANGO_DEBUG: true
      DJANGO_SETTINGS_MODULE: project.settings.development
      DATABASE_URL: postgresql://blueflow:testbed@192.168.10.2:5432/blueflow
      REDIS_URL: redis://192.168.10.3:6379/0
      SECRET_KEY: testbed-only-not-for-production
      CELERY_TASK_ALWAYS_EAGER: "true"

nodes:
  - id: postgres
    build: up
    networks: [clinical-vlan]

  - id: redis
    build: up
    networks: [clinical-vlan]

  - id: blueflow
    build: up
    networks: [clinical-vlan]
    env_from_fact: blueflow_api_env

  - id: tapirx
    build: up
    networks: [clinical-vlan]

  - id: replay
    build: run
    span: tapirx
    artifacts:
      - dicom_echo_sample

commands:
  - id: start-capture-proxy
    node: replay
    run:
      detached: true
      argv:
        - python3
        - -c
        - |
          import http.server, socketserver, urllib.request, sys
          UPSTREAM = sys.argv[1]
          PAYLOAD_FILE = "/tmp/tapirx-payload.json"
          class Handler(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
              body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
              open(PAYLOAD_FILE, "wb").write(body)
              req = urllib.request.Request(UPSTREAM, data=body, method="POST",
                headers={"Content-Type": "application/json"})
              r = urllib.request.urlopen(req)
              self.send_response(r.status)
              self.send_header("Content-Type", r.headers.get("Content-Type", "application/json"))
              self.end_headers()
              self.wfile.write(r.read())
            def log_message(self, *a): pass
          with socketserver.TCPServer(("0.0.0.0", 8765), Handler) as s: s.serve_forever()
        - { fact: assets_url }
    retry:
      attempts: 1
      delay_s: 0

  - id: passive-discovery
    node: tapirx
    run:
      detached: true
      argv:
        - tapirx
        - -iface
        - eth0
        - -apiurl
        - { fact: capture_proxy_url }
        - -limit
        - "25"
    retry:
      attempts: 2
      delay_s: 1

  - id: replay-dicom-on-wire
    node: replay
    run:
      argv:
        - tcpreplay
        - -i
        - eth0
        - { artifact: dicom_echo_sample }
    retry:
      attempts: 2
      delay_s: 2
    wait_s: 3

  - id: get-assets
    node: replay
    run:
      argv:
        - curl
        - { fact: assets_url }
    retry:
      attempts: 2
      delay_s: 2

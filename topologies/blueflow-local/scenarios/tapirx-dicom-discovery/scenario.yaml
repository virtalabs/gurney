# yaml-language-server: $schema=../../../../schemas/scenario.schema.json
# OBJ-2 TapirX DICOM Discovery Verification 
# This scenario is used to verify that TapirX can discover DICOM assets from a pcap file.
---
name: tapirx-dicom-pcap-replay
topology: topologies/blueflow-local/topology.yaml

facts:
  - name: assets_url
    value: http://blueflow:8000/api/assets/
  - name: blueflow_api_env
    value:
      DJANGO_ALLOWED_HOSTS: blueflow,localhost,127.0.0.1
      DEFAULT_USERNAME: admin
      DEFAULT_PASSWORD: admin
      DJANGO_DEBUG: true
      DJANGO_SETTINGS_MODULE: project.settings.development
      DATABASE_URL: postgresql://blueflow:testbed@192.168.10.2:5432/blueflow
      REDIS_URL: redis://192.168.10.3:6379/0
      SECRET_KEY: testbed-only-not-for-production
      CELERY_TASK_ALWAYS_EAGER: "true"

nodes:
  - id: postgres
    build: up
    networks: [clinical-vlan]

  - id: redis
    build: up
    networks: [clinical-vlan]

  - id: blueflow
    build: up
    networks: [clinical-vlan]
    env_from_fact: blueflow_api_env

  - id: tapirx
    build: up
    networks: [clinical-vlan]

  - id: replay
    build: run
    span: tapirx
    artifacts:
      - dicom_echo_sample

commands:
  - id: verify-assets-url
    node: blueflow
    run:
      argv:
        - http_check
        - { fact: assets_url }
        - --expect
        - "200"
    retry:
      attempts: 8
      delay_s: 2

  - id: passive-discovery
    node: tapirx
    run:
      detached: true
      argv:
        - tapirx
        - -iface
        - eth0
        - -apiurl
        - { fact: assets_url }
        - -limit
        - "25"
    retry:
      attempts: 2
      delay_s: 1

  - id: replay-dicom-on-wire
    node: replay
    run:
      argv:
        - tcpreplay
        - -i
        - eth0
        - { artifact: dicom_echo_sample }
    retry:
      attempts: 2
      delay_s: 2

  - id: get-assets
    node: replay
    run:
      argv:
        - curl
        - { fact: assets_url }
    retry:
      attempts: 2
      delay_s: 2

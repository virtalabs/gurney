# yaml-language-server: $schema=../../../../schemas/scenario.schema.json
# OBJ-2 Small Clinic Webhook Verification
# This scenario mirrors small-clinic-viper but targets webhook.site instead of Viper.
---
name: small-clinic-webhook
topology: topologies/blueflow-local/topology.yaml

facts:
  - name: assets_url
    value: http://blueflow:8000/api/assets/
  - name: upsert_url
    value: http://blueflow:8000/api/assets/upsert/
  - name: blueflow_api_env
    value:
      RUN_MIGRATIONS: "1"
      DJANGO_ALLOWED_HOSTS: blueflow,localhost,127.0.0.1
      DEFAULT_USERNAME: admin
      DEFAULT_PASSWORD: admin
      DJANGO_DEBUG: true
      DJANGO_SETTINGS_MODULE: project.settings.development
      DATABASE_URL: postgresql://blueflow:testbed@192.168.10.2:5432/blueflow
      REDIS_URL: redis://192.168.10.3:6379/0
      CELERY_BROKER_URL: redis://192.168.10.3:6379/0
      SECRET_KEY: testbed-only-not-for-production
      CELERY_TASK_ALWAYS_EAGER: "false"
      BLUEFLOW_BASE_URL: http://blueflow:8000
  - name: celery_worker_env
    value:
      DJANGO_ALLOWED_HOSTS: blueflow,localhost,127.0.0.1
      DEFAULT_USERNAME: admin
      DEFAULT_PASSWORD: admin
      DJANGO_DEBUG: true
      DJANGO_SETTINGS_MODULE: project.settings.development
      DATABASE_URL: postgresql://blueflow:testbed@192.168.10.2:5432/blueflow
      REDIS_URL: redis://192.168.10.3:6379/0
      CELERY_BROKER_URL: redis://192.168.10.3:6379/0
      SECRET_KEY: testbed-only-not-for-production
      CELERY_TASK_ALWAYS_EAGER: "false"
      BLUEFLOW_BASE_URL: http://blueflow:8000
  - name: webhook_api_endpoint
    value: http://blueflow:8000/api/viper/webhook/
  # Example webhook.site URLs; replace GUIDs as needed for local runs.
  - name: webhook_url
    value: https://webhook.site/b81c68ff-f2fb-46f0-ad31-5203056cdb81
  - name: webhook_requests_url
    value: https://webhook.site/token/b81c68ff-f2fb-46f0-ad31-5203056cdb81/requests

nodes:
  - id: postgres
    build: up
    networks: [clinical-vlan]

  - id: redis
    build: up
    networks: [clinical-vlan]

  - id: blueflow
    build: up
    networks: [clinical-vlan]
    env_from_fact: blueflow_api_env

  - id: celery-worker
    build: up
    networks: [clinical-vlan]
    env_from_fact: celery_worker_env

  - id: tapirx
    build: up
    networks: [clinical-vlan]

  - id: pacs-server
    build: up
    networks: [clinical-vlan]

  - id: orthanc-sender
    build: up
    span: tapirx

  - id: meddream
    build: up
    networks: [clinical-vlan]

  - id: replay
    build: run
    span: tapirx

commands:
  # Register a webhook pointing at webhook.site so Blueflow's connector
  # will POST discovered assets there.
  - id: register-webhook
    node: replay
    run:
      argv:
        - sh
        - -lc
        - |
          set -eu
          WEBHOOK_API_ENDPOINT="$1"
          WEBHOOK_URL="$2"
          curl -sS -X POST "$WEBHOOK_API_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d "{\"last_sync\":\"2020-01-01T00:00:00Z\",\"not_after\":\"2030-01-01T00:00:00Z\",\"page\":1,\"page_size\":10,\"webhook_url\":\"$WEBHOOK_URL\",\"auth_token\":\"\"}"
        - skip-argv0
        - { fact: webhook_api_endpoint }
        - { fact: webhook_url }
    retry:
      attempts: 3
      delay_s: 5

  - id: emulate-tap-device
    node: tapirx
    run:
      argv:
        - sh
        - -lc
        - |
          ip tuntap add dev tap0 mode tap 2>/dev/null || true
          ip link set tap0 up 2>/dev/null || true
          ip addr add 172.30.0.2/24 dev tap0 2>/dev/null || true
          ip -o link show tap0 2>/dev/null || true
    retry:
      attempts: 1
      delay_s: 1

  - id: passive-discovery
    node: tapirx
    run:
      detached: true
      argv:
        - tapirx
        - -iface
        - eth0
        - -verbose
        - -apiurl
        - { fact: upsert_url }
        - -limit
        - "25"
    retry:
      attempts: 2
      delay_s: 1

  - id: orthanc-push-to-dicom-listener
    node: replay
    run:
      argv:
        - sh
        - -lc
        - |
          set -eu
          curl -sS -u orthanc:orthanc \
            -X PUT "http://localhost:8042/modalities/orthanc-listener" \
            -H "Content-Type: application/json" \
            -d '{"AET":"CLINIC_PACS","Host":"pacs-server","Port":4242,"AllowEcho":true}'
          i=0
          while [ "$i" -lt 3 ]; do
            curl -sS -u orthanc:orthanc -X POST "http://localhost:8042/modalities/orthanc-listener/echo"
            i=$((i + 1))
          done
    retry:
      attempts: 2
      delay_s: 2

  - id: get-assets
    node: replay
    run:
      argv:
        - curl
        - { fact: assets_url }
    retry:
      attempts: 2
      delay_s: 2

  - id: get-remote-assets
    node: replay
    run:
      argv:
        - curl
        - { fact: webhook_requests_url }
    retry:
      attempts: 2
      delay_s: 2


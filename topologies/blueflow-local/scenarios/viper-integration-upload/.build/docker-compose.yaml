"services":
  "postgres":
    "image": "postgres:16.6-alpine"
    "labels":
      "gurney.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.2"
    "environment":
    - "POSTGRES_DB=blueflow"
    - "POSTGRES_USER=blueflow"
    - "POSTGRES_PASSWORD=testbed"
    "healthcheck":
      "test":
      - "CMD-SHELL"
      - "pg_isready -U blueflow"
      "interval": "5s"
      "timeout": "3s"
      "retries": !!int "5"
  "redis":
    "image": "redis:7.4-alpine"
    "labels":
      "gurney.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.3"
    "healthcheck":
      "test":
      - "CMD"
      - "redis-cli"
      - "ping"
      "interval": "5s"
      "timeout": "3s"
      "retries": !!int "5"
  "blueflow":
    "image": "virtalabsinc/blueflow:testbed-3.0.3"
    "labels":
      "gurney.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.4"
    "ports":
    - "8000:8000"
    "environment":
    - "DATABASE_URL=postgresql://blueflow:testbed@192.168.10.2:5432/blueflow"
    - "REDIS_URL=redis://192.168.10.3:6379/0"
    - "DJANGO_SETTINGS_MODULE=project.settings.development"
    - "SECRET_KEY=testbed-only-not-for-production"
    "healthcheck":
      "test":
      - "CMD"
      - "python"
      - "-c"
      - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/').getcode()\
        \ < 400 else 1)"
      "interval": "5s"
      "timeout": "3s"
      "retries": !!int "10"
    "depends_on":
      "postgres":
        "condition": "service_healthy"
      "redis":
        "condition": "service_healthy"
  "tapirx":
    "image": "tapirx:local"
    "labels":
      "gurney.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.6"
    "environment":
    - "BLUEFLOW_API_URL=http://192.168.10.4:8000/api"
    - "LISTEN_INTERFACE=eth0"
    "depends_on":
      "blueflow":
        "condition": "service_healthy"
    "cap_add":
    - "NET_ADMIN"
  "replay":
    "image": "replay:local"
    "labels":
      "gurney.managed": "true"
    "network_mode": "service:tapirx"
    "depends_on":
      "tapirx":
        "condition": "service_started"
  "viper-postgres":
    "image": "postgres:17-alpine"
    "labels":
      "gurney.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.20"
    "environment":
    - "POSTGRES_USER=postgres"
    - "POSTGRES_PASSWORD=postgres"
    - "POSTGRES_DB=viper"
    "healthcheck":
      "test":
      - "CMD-SHELL"
      - "pg_isready -U postgres"
      "interval": "5s"
      "timeout": "3s"
      "retries": !!int "5"
  "viper":
    "image": "upgrade/dev-viper:0.1.1"
    "labels":
      "gurney.managed": "true"
    "networks":
      "clinical-vlan":
        "ipv4_address": "192.168.10.21"
    "ports":
    - "3000:3000"
    "environment":
    - "DATABASE_URL=postgres://postgres:postgres@viper-postgres:5432/viper"
    - "BETTER_AUTH_SECRET=testbed-viper-auth-secret-not-for-production"
    - "BETTER_AUTH_URL=http://viper:3000"
    - "NEXT_PUBLIC_APP_URL=http://viper:3000"
    "healthcheck":
      "test":
      - "CMD"
      - "node"
      - "-e"
      - "require('http').get('http://localhost:3000/api/', (r) => process.exit(r.statusCode\
        \ < 400 ? 0 : 1)).on('error', () => process.exit(1))"
      "interval": "10s"
      "timeout": "5s"
      "retries": !!int "15"
    "depends_on":
      "viper-postgres":
        "condition": "service_healthy"
"networks":
  "clinical-vlan":
    "driver": "bridge"
    "ipam":
      "driver": "default"
      "config":
      - "subnet": "192.168.10.0/24"
    "labels":
      "gurney.managed": "true"

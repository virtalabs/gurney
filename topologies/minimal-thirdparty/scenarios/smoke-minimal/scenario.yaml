# yaml-language-server: $schema=../../../../schemas/scenario.schema.json
# Minimal scenario using only third-party images (postgres, redis, orthanc).
# Use this to validate testbed infrastructure without BlueFlow/TapirX.
name: smoke-minimal
topology: topologies/minimal-thirdparty/topology.yaml

facts: []

nodes:
  - id: postgres
    build: up
    networks: [clinical-vlan]
  - id: redis
    build: up
    networks: [clinical-vlan]
  - id: pacs-server
    build: up
    networks: [clinical-vlan]

commands: []

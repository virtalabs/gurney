[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gurney"
version = "0.2.0"
description = "A reproducible test environment for rapidly testing passive and active scanning pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Gordon" }]
keywords = ["blueflow", "testbed", "dicom", "hl7", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "radon>=6.0",
    "ruff>=0.6",
    "prospector>=1.7",
    "yamllint>=1.35",
]

[project.scripts]
gurney = "gurney.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.radon]
# Cyclomatic complexity: A=1-5, B=6-10, C=11-20, D=21-30, E=31+
# Aim for simple, pythonic code — avoid deep nesting
cc_min = "B"
ignore = "tests"

[tool.ruff]
line-length = 100
target-version = "py311"

networks:
  - name: clinical-vlan
    cidr: 192.168.10.0/24

nodes:
  - name: postgres
    kind: docker
    image: postgres:16.6-alpine
    network: clinical-vlan
    ip: 192.168.10.2
    environment:
      POSTGRES_DB: blueflow
      POSTGRES_USER: blueflow
      POSTGRES_PASSWORD: testbed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueflow"]
      interval_s: 5
      timeout_s: 3
      retries: 5

  - name: redis
    kind: docker
    image: redis:7.4-alpine
    network: clinical-vlan
    ip: 192.168.10.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval_s: 5
      timeout_s: 3
      retries: 5

  - name: blueflow
    kind: docker
    image: ${BLUEFLOW_IMAGE:-virtalabsinc/blueflow:testbed-3.0.0}
    network: clinical-vlan
    ip: 192.168.10.4
    ports: [8000]
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgresql://blueflow:testbed@192.168.10.2:5432/blueflow
      REDIS_URL: redis://192.168.10.3:6379/0
      DJANGO_SETTINGS_MODULE: project.settings.development
      SECRET_KEY: testbed-only-not-for-production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/').getcode() < 400 else 1)"]
      interval_s: 5
      timeout_s: 3
      retries: 10

  - name: celery-worker
    kind: docker
    image: ${BLUEFLOW_IMAGE:-virtalabsinc/blueflow:testbed-3.0.0}
    network: clinical-vlan
    ip: 192.168.10.5
    depends_on: [postgres, redis, blueflow]
    command: uv run celery -A bf_opencore worker -l info
    environment:
      DATABASE_URL: postgresql://blueflow:testbed@192.168.10.2:5432/blueflow
      REDIS_URL: redis://192.168.10.3:6379/0
      DJANGO_SETTINGS_MODULE: project.settings.development
      SECRET_KEY: testbed-only-not-for-production

  - name: tapirx
    kind: docker
    image: ${TAPIRX_IMAGE:-tapirx:local}
    network: clinical-vlan
    ip: 192.168.10.6
    depends_on: [blueflow]
    command: -iface eth0 -apiurl http://blueflow:8000/api/assets/upsert/ -debug

  - name: replay
    kind: docker
    image: ${REPLAY_IMAGE:-replay:local}
    network: clinical-vlan
    ip: 192.168.10.7
    depends_on: [tapirx]
    volumes:
      - "${PWD}/replay/pcap:/pcap:ro"

  - name: pacs-server
    kind: docker
    image: orthancteam/orthanc:25.12.3
    network: clinical-vlan
    ip: 192.168.10.10
    ports: [4242, 8042]

# OBJ-2 TapirX DICOM Discovery Verification (DSL v2)
# Two TapirX: one reads pcap file, one listens on eth0 and receives replayed pcap via replay sidecar.
name: tapirx-dicom-discovery
topology: testbed.yaml

facts:
  - name: pcap_file
    value: /pcap/DICOM_C-ECHO-echoscu.pcap
  - name: assets_url
    value: http://blueflow:8000/api/assets/
  - name: blueflow_api_env
    value:
      DJANGO_ALLOWED_HOSTS: blueflow,localhost,127.0.0.1
      DEFAULT_USERNAME: admin
      DEFAULT_PASSWORD: admin
      DJANGO_DEBUG: true
      DJANGO_SETTINGS_MODULE: project.settings.development
      DATABASE_URL: postgresql://blueflow:testbed@192.168.10.2:5432/blueflow
      REDIS_URL: redis://192.168.10.3:6379/0
      SECRET_KEY: testbed-only-not-for-production
      CELERY_TASK_ALWAYS_EAGER: "true"

nodes:
  - id: postgres
    build: up
    networks: [clinical-vlan]

  - id: redis
    build: up
    networks: [clinical-vlan]

  - id: blueflow
    build: up
    networks: [clinical-vlan]
    env_from_fact: blueflow_api_env

  - id: tapirx
    build: up
    networks: [clinical-vlan]

  - id: replay
    build: run
    span: tapirx

commands:
  - id: verify-assets-url
    node: blueflow
    run:
      argv:
        - http_check
        - { fact: assets_url }
        - --expect
        - "200"
    retry:
      attempts: 8
      delay_s: 2
  
  - id: passive-discovery
    node: tapirx
    run:
      detached: true
      # Full command: tapirx plus args (run via exec in tapirx-live container).
      argv:
        - tapirx
        - -iface
        - eth0
        - -apiurl 
        - { fact: assets_url }
        - -limit
        - "25"
    retry:
      attempts: 2
      delay_s: 1

  - id: replay-dicom-on-wire
    node: replay
    run:
      argv:
        - tcpreplay
        - -i
        - eth0
        - { fact: pcap_file }
    retry:
      attempts: 2
      delay_s: 2
 
  - id: get-assets
    node: replay
    run:
      argv:
        - curl
        - { fact: assets_url }
    retry:
      attempts: 2
      delay_s: 2